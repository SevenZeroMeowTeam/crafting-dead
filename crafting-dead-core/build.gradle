plugins {
    id 'crafting-dead'
    id 'java-library'
}

dependencies {
    implementation('software.bernie.geckolib:geckolib-neoforge-1.21.1:4.7.5')

    // Sentry for error tracking - available in dev, bundled via jarJar for production
    api('io.sentry:sentry:6.34.0') {
        exclude group: 'com.google.code.gson', module: 'gson'
    }
}

jar {
    manifest {
        attributes([
            "Implementation-Title": project.name,
            "Implementation-Version": project.version,
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            "MixinConfigs": "craftingdead.mixins.json"
        ])
    }
}
