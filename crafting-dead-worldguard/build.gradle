plugins {
    id 'crafting-dead'
}

repositories {
    maven {
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
        content {
            includeGroup 'org.bukkit'
            includeGroup 'org.spigotmc'
        }
    }
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots' }
    maven { url 'https://oss.sonatype.org/content/repositories/central' }
    maven { url 'https://maven.enginehub.org/repo' }
}

dependencies {
    implementation project(':crafting-dead-core')
    implementation project(':crafting-dead-survival')

    // Bukkit/WorldGuard 仅存在于混合端（Arclight/Mohist）运行时，不能打进 jar，
    // 只用于编译；运行时有 WorldGuard 才启用集成，纯 NeoForge 下优雅禁用。
    compileOnly group: 'org.spigotmc', name: 'spigot-api', version: '1.20.1-R0.1-SNAPSHOT'
    compileOnly group: 'com.sk89q.worldguard', name: 'worldguard-bukkit', version: '7.0.7'
}

jar {
    archiveBaseName = project.name
    from rootProject.file('LICENSE.txt')
    manifest {
        attributes([
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}