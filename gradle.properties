# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
# Increased from -Xmx3G to avoid javac OutOfMemoryError during Forge remapped compilation.
org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=1G
org.gradle.workers.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=1G
org.gradle.daemon=false

minecraft_version=1.21.1
# 目标 NeoForge 21.1.x 全版本系列；构建用最新 21.1.249，运行范围由 neoforge.mods.toml 声明 [21.1.0,22)
neo_version=21.1.249
parchment_version=2024.11.17
mixin_version=0.8.7
