pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'NeoForge'
            url = 'https://maven.neoforged.net/releases/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'crafting-dead'

include 'crafting-dead-core'
include 'crafting-dead-survival'
include 'crafting-dead-decoration'
include 'crafting-dead-worldguard'