plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.6.0'
}

dependencyResolutionManagement {
    repositories {
        mavenCentral()
        maven { url 'https://repo.spring.io/milestone' }
        maven { url 'https://repository.hazelcast.com/release/' }
        maven {
            name 'minecraft'
            url 'https://libraries.minecraft.net/'
        }
        maven {
            name 'forge'
            url 'https://maven.minecraftforge.net/'
        }
        maven {
            url 'https://maven.brad.ac/repository/maven-central-proxy/releases'
            mavenContent {
                releasesOnly()
            }
        }
        maven {
            url 'https://maven.brad.ac/repository/maven-central-proxy/snapshots'
            mavenContent {
                snapshotsOnly()
            }
        }
        maven { url 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
        maven { url = 'https://repo.extendedclip.com/releases/' }
        maven {
            name 'sponge'
            url 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }
}

rootProject.name = 'crafting-dead'

// Crafting Dead modules
include 'crafting-dead-core'
include 'crafting-dead-immerse'
include 'crafting-dead-survival'
include 'crafting-dead-decoration'
include 'crafting-dead-worldguard'

// Rocket modules
include 'rocket-auth'
include 'rocket-common'
include 'rocket-connector'
include 'rocket-discord'
include 'rocket-gateway'
include 'rocket-placeholder'
include 'rocket-projects'
include 'rocket-sdk'
include 'rocket-service-common'
include 'rocket-social'