name: Crafting Dead

on:
  push:
    branches: [ 1.20.x, 1.19.x, 1.18.x, kotlin-refactor-1.19.x ]
  pull_request:
    branches: [ 1.20.x, 1.19.x, 1.18.x, kotlin-refactor-1.19.x ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 17
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # libs/ 被 .gitignore 忽略，CI 需要先下载 Physics Mod 依赖 jar 才能编译
    - name: Download Physics Mod dependency
      run: |
        mkdir -p crafting-dead-survival/libs
        curl -L --retry 3 --fail -o crafting-dead-survival/libs/physics-mod-2.12.5-mc-1.19.2-forge.jar \
          https://cdn.modrinth.com/data/Xy8aRQKS/versions/x24qI8Vg/physics-mod-2.12.5-mc-1.19.2-forge.jar

    - name: Build with Gradle
      run: ./gradlew clean build --no-daemon

    - name: Upload build artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: crafting-dead-${{ github.ref_name }}-${{ github.run_number }}
        path: |
          ./crafting-dead-core/build/libs/*.jar
          ./crafting-dead-survival/build/libs/*.jar
          ./crafting-dead-decoration/build/libs/*.jar
        if-no-files-found: error

    - name: Read mod versions
      if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/1.20.x' || github.ref == 'refs/heads/1.19.x' || github.ref == 'refs/heads/1.18.x' || github.ref == 'refs/heads/kotlin-refactor-1.19.x')
      id: versions
      run: |
        echo "mc=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2)" >> "$GITHUB_OUTPUT"
        echo "core=$(grep '^mod_version=' crafting-dead-core/gradle.properties | cut -d'=' -f2)" >> "$GITHUB_OUTPUT"
        echo "survival=$(grep '^mod_version=' crafting-dead-survival/gradle.properties | cut -d'=' -f2)" >> "$GITHUB_OUTPUT"
        echo "decoration=$(grep '^mod_version=' crafting-dead-decoration/gradle.properties | cut -d'=' -f2)" >> "$GITHUB_OUTPUT"

    - name: Publish to GitHub Releases
      if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/1.20.x' || github.ref == 'refs/heads/1.19.x' || github.ref == 'refs/heads/1.18.x' || github.ref == 'refs/heads/kotlin-refactor-1.19.x')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.ref_name }}-${{ github.run_number }}
        name: "Build #${{ github.run_number }} (${{ github.ref_name }})"
        make_latest: true
        generate_release_notes: true
        body: |
          自动构建（推送至 `${{ github.ref_name }}` 分支触发）。

          | 模块 | 版本 |
          |------|------|
          | crafting-dead-core | ${{ steps.versions.outputs.mc }}-${{ steps.versions.outputs.core }}.${{ github.run_number }} |
          | crafting-dead-survival | ${{ steps.versions.outputs.mc }}-${{ steps.versions.outputs.survival }}.${{ github.run_number }} |
          | crafting-dead-decoration | ${{ steps.versions.outputs.mc }}-${{ steps.versions.outputs.decoration }}.${{ github.run_number }} |

          **提交信息**: ${{ github.event.head_commit.message || 'N/A' }}

          **Commit**: `${{ github.sha }}`
          **Branch**: `${{ github.ref_name }}`
        files: |
          crafting-dead-core/build/libs/*.jar
          crafting-dead-survival/build/libs/*.jar
          crafting-dead-decoration/build/libs/*.jar
