name: Crafting Dead

on:
  push:
    branches: [ 1.20.x, 1.18.x ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ 1.20.x, 1.18.x ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 17

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle
          ./.gradle
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: ${{ runner.os }}-gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: crafting-dead
        path: |
          ./crafting-dead-core/build/libs/*.jar
          ./crafting-dead-survival/build/libs/*.jar
          ./crafting-dead-decoration/build/libs/*.jar
          ./crafting-dead-worldguard/build/libs/*.jar

    - name: Read mod versions
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/1.20.x'
      id: versions
      run: |
        echo "core=$(grep '^mod_version=' crafting-dead-core/gradle.properties | cut -d'=' -f2)" >> "$GITHUB_OUTPUT"
        echo "survival=$(grep '^mod_version=' crafting-dead-survival/gradle.properties | cut -d'=' -f2)" >> "$GITHUB_OUTPUT"
        echo "decoration=$(grep '^mod_version=' crafting-dead-decoration/gradle.properties | cut -d'=' -f2)" >> "$GITHUB_OUTPUT"
        echo "worldguard=$(grep '^mod_version=' crafting-dead-worldguard/gradle.properties | cut -d'=' -f2)" >> "$GITHUB_OUTPUT"

    - name: Publish to GitHub Releases
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/1.20.x'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: "Build #${{ github.run_number }} (Minecraft 1.20.1)"
        make_latest: true
        body: |
          自动构建（推送至 `1.20.x` 分支触发）。

          | 模块 | 版本 |
          |------|------|
          | crafting-dead-core | 1.20.1-${{ steps.versions.outputs.core }}.${{ github.run_number }} |
          | crafting-dead-survival | 1.20.1-${{ steps.versions.outputs.survival }}.${{ github.run_number }} |
          | crafting-dead-decoration | 1.20.1-${{ steps.versions.outputs.decoration }}.${{ github.run_number }} |
          | crafting-dead-worldguard | 1.20.1-${{ steps.versions.outputs.worldguard }}.${{ github.run_number }} |

          **提交信息**: ${{ github.event.head_commit.message }}

          **Commit**: `${{ github.sha }}`
        files: |
          crafting-dead-core/build/libs/*.jar
          crafting-dead-survival/build/libs/*.jar
          crafting-dead-decoration/build/libs/*.jar
          crafting-dead-worldguard/build/libs/*.jar
