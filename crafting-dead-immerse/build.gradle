plugins {
    id 'crafting-dead'
}

mixin {
    add sourceSets.main, 'craftingdeadimmerse.refmap.json'
}

minecraft {
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            taskName 'runImmerseClient'

            workingDirectory project.file('run/client')

            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'

            args '--mixin', 'craftingdeadimmerse.mixins.json', '--mixin', 'craftingdead.mixins.json'

            mods {
                craftingdeadimmerse {
                    source sourceSets.main
                }
                craftingdead {
                    source project(':crafting-dead-core').sourceSets.main
                }
            }
        }

        server {
            taskName 'runImmerseServer'

            workingDirectory project.file('run/server')

            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'

            args '--mixin', 'craftingdeadimmerse.mixins.json', '--mixin', 'craftingdead.mixins.json'

            mods {
                craftingdeadimmerse {
                    source sourceSets.main
                }
                craftingdead {
                    source project(':crafting-dead-core').sourceSets.main
                }
            }
        }
        
        data {
            taskName 'runImmerseData'
      
            workingDirectory project.file('run/data')

            property 'forge.logging.markers', 'SCAN,REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            args '--mod', 'craftingdeadimmerse', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')

            environment 'target', 'fmluserdevdata'

            mods {
                craftingdeadimmerse {
                    source sourceSets.main
                }
                craftingdead {
                    source project(':crafting-dead-core').sourceSets.main
                }
            }
        }
    }
}

def lwjgl_natives = ['natives-windows', 'natives-linux', 'natives-macos']
def skija_natives = ['skija-macos-x64', 'skija-macos-arm64', 'skija-linux', 'skija-windows']
def releaseBuild = rootProject.extensions.extraProperties.has('releaseBuild') ?
    rootProject.extensions.extraProperties.get('releaseBuild') as Boolean : false
def rocketConnectorProject = rootProject.findProject(':rocket-connector')

configurations {
    lwjgl
    lwjglNative
    minecraftLibrary.extendsFrom lwjgl
    minecraftLibrary.extendsFrom lwjglNative
    
    library
    library.extendsFrom lwjgl
    minecraftLibrary.extendsFrom library
    jarJar.extendsFrom library
    implementation.extendsFrom library
    api.extendsFrom library
}

if (releaseBuild) {
    configurations.minecraftLibrary.extendsFrom(configurations.jarJar)
    configurations.runtimeClasspath.extendsFrom(configurations.jarJar)
}
if (!releaseBuild) {
    configurations.runtimeElements.outgoing.artifacts.clear()
    configurations.runtimeElements.outgoing.artifact(tasks.named('jar'))

    configurations.apiElements.outgoing.artifacts.clear()
    configurations.apiElements.outgoing.artifact(tasks.named('jar'))
}

dependencies {
    implementation project(':crafting-dead-core')

    if (rocketConnectorProject != null) {
        implementation rocketConnectorProject
    } else {
        logger.lifecycle('rocket-connector project not present; skipping rocket dependency wiring for crafting-dead-immerse')
    }

    library group: 'flare', name: 'flare-eventbus', version: '[2.0.1]'
    // eventbus transitive dependencies
    jarJar group: 'flare', name: 'flare-commons', version: '[0.0.2]'
    jarJar group: 'com.esotericsoftware', name: 'reflectasm', version: '[1.11.9]'

    lwjgl group: 'org.lwjgl', name: 'lwjgl', version: "[${lwjgl_version}]"
    minecraftLibrary group: 'org.lwjgl', name: 'lwjgl', version: "[${lwjgl_version}]"

    lwjgl(group: 'org.lwjgl', name: 'lwjgl-yoga', version: "[${lwjgl_version}]") {
        exclude group: 'org.lwjgl', module: 'lwjgl'
    }
    minecraftLibrary(group: 'org.lwjgl', name: 'lwjgl-yoga', version: "[${lwjgl_version}]") {
        exclude group: 'org.lwjgl', module: 'lwjgl'
    }
    jarJar group: 'org.lwjgl', name: 'lwjgl-yoga', version: "[${lwjgl_version}]"
    lwjgl_natives.each {
        lwjglNative(group: 'org.lwjgl', name: 'lwjgl-yoga', version: "[${lwjgl_version}]", classifier: it) {
             transitive = false
        }
    }

    skija_natives.each {
        library group: 'io.github.humbleui', name: it, version: '[0.106.0]'
        minecraftLibrary group: 'io.github.humbleui', name: it, version: '0.106.0'
    }
    // Skija shared classes need to be available both for jarJar shading and dev runtime
    library group: 'io.github.humbleui', name: 'skija-shared', version: '[0.106.0]'
    library group: 'io.github.humbleui', name: 'types', version: '[0.1.1]'
    minecraftLibrary group: 'io.github.humbleui', name: 'skija-shared', version: '0.106.0'
    minecraftLibrary group: 'io.github.humbleui', name: 'types', version: '0.1.1'
    jarJar group: 'io.github.humbleui', name: 'skija-shared', version: '[0.106.0]'
    jarJar group: 'io.github.humbleui', name: 'types', version: '[0.1.1]'

    library group: 'net.java.timingframework', name: 'timingframework-core', version: '[7.3.1]'
    minecraftLibrary group: 'net.java.timingframework', name: 'timingframework-core', version: '7.3.1'

    library(group: 'io.sentry', name: 'sentry', version: '[5.6.0]') {
        exclude group: 'com.google.code.gson', module: 'gson'
    }

    minecraftLibrary group: 'net.rocketpowered', name: 'rocket-sdk', version: '0.0.8'
}

if (releaseBuild) {
    reobf { jarJar { } }
}

if (releaseBuild) {
    jarJar.enable()
} else {
    tasks.named('jarJar').configure { enabled = false }
}

if (rocketConnectorProject == null) {
    def isCI = System.getenv('CI') || System.getenv('GITHUB_ACTIONS') || project.hasProperty('ci')
    if (!isCI) {
        tasks.configureEach { task ->
            if (task.name in ['compileJava', 'jarJar', 'classes', 'jar']) {
                task.doFirst {
                    throw new org.gradle.api.GradleException('rocket-connector sources or artifacts are required to build crafting-dead-immerse. Please include the closed-source module locally before running this task.')
                }
            }
        }
    } else {
        logger.lifecycle('CI environment detected; allowing crafting-dead-immerse build without rocket-connector')
    }
}

tasks.withType(Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'module-info.class'

    if (releaseBuild) {
        into 'lwjgl-natives', {
            exclude 'META-INF/'
            from {
                project.configurations.lwjglNative.collect { it.isDirectory() ? it : zipTree(it) }
            }
        }

        from {
            project.configurations.lwjgl.collect { it.isDirectory() ? it : zipTree(it) }
        }
    }
}

jar {
    manifest {
        attributes([
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            'MixinConfigs': 'craftingdeadimmerse.mixins.json'
        ])
    }
}
