plugins {
    id 'crafting-dead'
}

repositories {
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
    maven {
        name = 'WTHIT'
        url = 'https://maven2.bai.lol'
        content {
            includeGroup 'mcp.mobius.waila'
            includeGroup 'lol.bai'
        }
    }
}

dependencies {
    // GeckoLib 4 animation engine - required at runtime, bundled via jarJar
    implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.20.1:4.7.4')
    jarJar(group: 'software.bernie.geckolib', name: 'geckolib-forge-1.20.1', version: '[4.7.4,5.0.0)')
}

mixin {
    add sourceSets.main, 'craftingdeadsurvival.refmap.json'
}

minecraft {
    runs {
        client {
            taskName 'runSurvivalClient'

            workingDirectory project.file('run/client')

            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

            args '--mixin', 'craftingdead.mixins.json', '--mixin', 'craftingdeadsurvival.mixins.json'

            mods {
                craftingdeadsurvival {
                    source sourceSets.main
                }
                craftingdead {
                    source project(':crafting-dead-core').sourceSets.main
                }
            }
        }

        server {
            taskName 'runSurvivalServer'

            workingDirectory project.file('run/server')

            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

            args '--mixin', 'craftingdead.mixins.json', '--mixin', 'craftingdeadsurvival.mixins.json'

            mods {
                craftingdeadsurvival {
                    source sourceSets.main
                }
                craftingdead {
                    source project(':crafting-dead-core').sourceSets.main
                }
            }
        }
        
        data {
            taskName 'runSurvivalData'
      
            workingDirectory project.file('run/data')

            property 'forge.logging.markers', 'SCAN,REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            args '--mod', 'craftingdeadsurvival', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/'), '--existing-mod', 'craftingdead'

            environment 'target', 'fmluserdevdata'

            mods {
                craftingdeadsurvival {
                    source sourceSets.main
                }
                craftingdead {
                    source project(':crafting-dead-core').sourceSets.main
                }
            }
        }
    }
}

dependencies {
    implementation project(':crafting-dead-core')

    // WTHIT (What The Hell Is That?) plugin API - optional/custom integration.
    // compileOnly: not bundled. The wthit_plugins.json entry is only read by WTHIT,
    // so the plugin class (mcp.mobius.waila.api.*) is loaded only when WTHIT is installed.
    compileOnly fg.deobf('mcp.mobius.waila:wthit-api:forge-8.19.3')

    // Tough As Nails (optional runtime dependency for thirst compatibility)
    compileOnly files('../libs/ToughAsNails-forge-1.20.1-9.2.0.171.jar')
    // Thirst was Taken (optional runtime dependency for thirst compatibility)
    compileOnly files('../libs/ThirstWasTaken-1.20.1-1.4.0.jar')
    // Physics Mod Ragdoll API (net.diebuddies.physics.ragdoll) - compile only.
    // 运行时不打包：Physics Mod 由玩家自行安装到 mods 目录。
    // jar 需手动放置到 crafting-dead-survival/libs/（从 https://minecraftphysicsmod.com/download 下载）
    compileOnly fg.deobf(files('libs/physics-mod-3.0.20-mc-1.20.1-forge.jar'))

    // NOTE: brad.ac maven repository is currently unreachable.
    // Re-enable when https://dl.brad.ac is back online.
    // minecraftLibrary group: 'net.rocketpowered', name: 'rocket-sdk', version: '0.0.10'
    // minecraftLibrary group: 'net.rocketpowered', name: 'rocket-common', version: '0.0.7'
}

jar {
    archiveFileName = "crafting-dead-survival-${project.property('minecraft_version')}-kotlin.jar"
    manifest {
        attributes([
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            'MixinConfigs': 'craftingdeadsurvival.mixins.json'
        ])
    }
}