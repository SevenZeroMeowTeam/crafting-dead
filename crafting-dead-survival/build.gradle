plugins {
    id 'crafting-dead'
}

def rocketConnectorProject = rootProject.findProject(':rocket-connector')
def rocketConnectorAvailable = false
try {
    if (rocketConnectorProject != null) {
        // Try to access sourceSets to see if the project is properly configured
        rocketConnectorProject.sourceSets
        rocketConnectorAvailable = true
    }
} catch (Exception e) {
    logger.lifecycle('rocket-connector project exists but is not properly configured; skipping rocket dependency wiring for crafting-dead-survival')
}

if (rocketConnectorAvailable) {
    evaluationDependsOn(':rocket-connector')
} else {
    logger.lifecycle('rocket-connector project not present or not configured; skipping rocket dependency wiring for crafting-dead-survival')
}

mixin {
    add sourceSets.main, 'craftingdeadsurvival.refmap.json'
}

minecraft {
    runs {
        client {
            taskName 'runSurvivalClient'

            workingDirectory project.file('run/client')

            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

            args '--mixin', 'craftingdead.mixins.json', '--mixin', 'craftingdeadsurvival.mixins.json'

            mods {
                craftingdeadsurvival {
                    source sourceSets.main
                }
                craftingdead {
                    source project(':crafting-dead-core').sourceSets.main
                }
                craftingdeaddecoration {
                    source project(':crafting-dead-decoration').sourceSets.main
                }
                craftingdeadimmerse {
                    source project(':crafting-dead-immerse').sourceSets.main
                }
                if (rocketConnectorAvailable) {
                    rocketconnector {
                        source project(':rocket-connector').sourceSets.main
                    }
                }
            }
        }

        server {
            taskName 'runSurvivalServer'

            workingDirectory project.file('run/server')

            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

            args '--mixin', 'craftingdead.mixins.json', '--mixin', 'craftingdeadsurvival.mixins.json'

            mods {
                craftingdeadsurvival {
                    source sourceSets.main
                }
                craftingdead {
                    source project(':crafting-dead-core').sourceSets.main
                }
                craftingdeaddecoration {
                    source project(':crafting-dead-decoration').sourceSets.main
                }
                craftingdeadimmerse {
                    source project(':crafting-dead-immerse').sourceSets.main
                }
                if (rocketConnectorAvailable) {
                    rocketconnector {
                        source project(':rocket-connector').sourceSets.main
                    }
                }
            }
        }
        
        data {
            taskName 'runSurvivalData'
      
            workingDirectory project.file('run/data')

            property 'forge.logging.markers', 'SCAN,REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            args '--mod', 'craftingdeadsurvival', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/'), '--existing-mod', 'craftingdead'

            environment 'target', 'fmluserdevdata'

            mods {
                craftingdeadsurvival {
                    source sourceSets.main
                }
                craftingdead {
                    source project(':crafting-dead-core').sourceSets.main
                }
                craftingdeaddecoration {
                    source project(':crafting-dead-decoration').sourceSets.main
                }
                craftingdeadimmerse {
                    source project(':crafting-dead-immerse').sourceSets.main
                }
                if (rocketConnectorAvailable) {
                    rocketconnector {
                        source project(':rocket-connector').sourceSets.main
                    }
                }
            }
        }
    }
}

dependencies {
    compileOnly project(':crafting-dead-core')
    compileOnly project(':crafting-dead-immerse')
    compileOnly project(':crafting-dead-decoration')
    if (rocketConnectorAvailable) {
        compileOnly project(':rocket-connector')
    }
    minecraftLibrary project(path: ':crafting-dead-immerse', configuration: 'minecraftLibrary')
    
    def yogaVersion = project(':crafting-dead-immerse').findProperty('lwjgl_version') ?: project.findProperty('lwjgl_version')
    minecraftLibrary group: 'org.lwjgl', name: 'lwjgl', version: "[${yogaVersion}]"
    minecraftLibrary(group: 'org.lwjgl', name: 'lwjgl-yoga', version: "[${yogaVersion}]") {
        exclude group: 'org.lwjgl', module: 'lwjgl'
    }

    // Dirty hacks for depending on immerse
    minecraftLibrary group: 'net.rocketpowered', name: 'rocket-sdk', version: '0.0.8'
}

jar {
    manifest {
        attributes([
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            'MixinConfigs': 'craftingdeadsurvival.mixins.json'
        ])
    }
}