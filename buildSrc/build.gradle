plugins {
    id 'groovy-gradle-plugin'
}

repositories {
    gradlePluginPortal()
    maven { 
        name 'forge'
        url 'https://maven.minecraftforge.net/'
    }
    maven {
        name 'sponge'
        url 'https://repo.spongepowered.org/repository/maven-public/'
    }
}

dependencies {
    implementation group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '[6.0,7.0)'
    implementation group: 'gradle.plugin.org.cadixdev.gradle', name: 'licenser', version: '0.6.1'
    implementation group: 'org.spongepowered', name: 'mixingradle', version: '0.7.+', changing: true
    // Kotlin JVM 插件：Kotlin + Java 混合重构（版本需与 Gradle 8.5 / Java 21 兼容）
    implementation 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
}