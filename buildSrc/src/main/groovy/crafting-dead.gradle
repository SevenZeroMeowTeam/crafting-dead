plugins {
    id 'net.neoforged.moddev'
    id 'java'
    id 'eclipse'
    id 'org.cadixdev.licenser'
}

group = 'com.craftingdead'
version = "${minecraft_version}-${mod_version}." + (System.env.GITHUB_RUN_NUMBER ?: "homebaked")

neoForge {
    version = "${neo_version}"

    parchment {
        minecraftVersion = "${minecraft_version}"
        mappingsVersion = "${parchment_version}"
    }

    mods {
        "${rootProject.name}" {
            sourceSet(sourceSets.main)
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven {
        name 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
    maven {
        name 'Curse Maven'
        url 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

// NeoForge 1.20.5+ uses Mojang official mappings in both dev and production,
// so Mixin annotations do not need a refmap and the Mixin annotation processor
// (which would fail to locate obfuscation mappings in the moddev pipeline) is omitted.
dependencies {
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

jar {
    archiveBaseName = project.name
    from rootProject.file('LICENSE.txt')
}

license {
    include 'com/craftingdead/**/*.java'
    header = rootProject.file('HEADER.txt')
    ext {
        organization = 'NexusNode LTD'
        year = 2022
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}