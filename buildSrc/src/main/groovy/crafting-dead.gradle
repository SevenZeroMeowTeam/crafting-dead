plugins {
    id 'net.minecraftforge.gradle'
    id 'java'
    id 'eclipse'
    // Kotlin + Java 混合重构
    id 'org.jetbrains.kotlin.jvm'
    id 'org.cadixdev.licenser'
    id 'org.spongepowered.mixin'
}

group = 'com.craftingdead'
// Kotlin 混编重构分支：jar 文件名与 mod 版本添加 -kotlin 标记
version = "${minecraft_version}-${mod_version}-kotlin." + (System.env.GITHUB_RUN_NUMBER ?: "homebaked")

// Kotlin 配置：与 Java 21 工具链一致，Kotlin 源码放在 src/main/kotlin
kotlin {
    jvmToolchain(21)
}
sourceSets.main.kotlin.srcDirs += 'src/main/kotlin'
sourceSets.test.kotlin.srcDirs += 'src/test/kotlin'

minecraft {
    mappings channel: 'official', version: "${minecraft_version}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven {
        name 'sponge'
        url 'https://repo.spongepowered.org/repository/maven-public/'
    }
    maven {
        name 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
}

dependencies {
    minecraft group: 'net.minecraftforge', name:'forge', version: "${minecraft_version}-${forge_version}"
    implementation group: 'org.spongepowered', name: 'mixin', version: "${mixin_version}"
    annotationProcessor("org.spongepowered:mixin:${mixin_version}:processor")
    testAnnotationProcessor("org.spongepowered:mixin:${mixin_version}:processor")
    // Kotlin 标准库（Java 与 Kotlin 混编必需）
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

jar {
    archiveBaseName = project.name
    from rootProject.file('LICENSE.txt')
}

license {
    include 'com/craftingdead/**/*.java'
    header = rootProject.file('HEADER.txt')
    ext {
        organization = 'NexusNode LTD'
        year = 2022
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}